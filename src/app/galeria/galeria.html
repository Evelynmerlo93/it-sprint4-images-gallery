<div class="galeria-container">

  <h2>Galería de Imágenes</h2>
  
  <div class="grid-tarjetas">

    <!-- Recorremos la lista y agregamos '; let esPrimero = $first' -->
    @for (img of listaImagenes; track img.id; let esPrimero = $first) {
      
      <app-tarjeta-img 
        [imagenTarjeta]="img" 
        [isFeatured]="esPrimero"
        (alSeleccionar)="manejarClickImagen($event)">
      </app-tarjeta-img>
      
    }

  </div>
</div>
